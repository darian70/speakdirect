name: CI
on: [push, pull_request]
jobs:
  build-monorepo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build

  build-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps (website)
        run: npm install --no-audit --no-fund
        working-directory: website
      - name: Lint (website)
        run: npm run lint --if-present
        working-directory: website
      - name: Build (website)
        run: npm run build
        working-directory: website

  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Markdownlint
        run: npx --yes markdownlint-cli "**/*.md" --ignore node_modules
      - name: Prettier Check
        run: npx --yes prettier . --check

  python-starters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: LangGraph starter - install
        run: |
          python -m venv .venv && source .venv/bin/activate
          pip install -r starters/langgraph-agent/requirements.txt
      - name: LangGraph starter - smoke
        run: |
          source .venv/bin/activate
          python - << 'PY'
          import importlib
          import sys
          sys.path.append('starters/langgraph-agent')
          import server, graph
          print('langgraph ok')
          PY
      - name: CrewAI starter - install
        run: |
          source .venv/bin/activate
          pip install -r starters/crewai-agent/requirements.txt || true
      - name: CrewAI starter - smoke
        run: |
          source .venv/bin/activate
          python - << 'PY'
          import sys
          sys.path.append('starters/crewai-agent')
          import main
          print('crewai ok')
          PY
      - name: LlamaIndex RAG starter - install
        run: |
          source .venv/bin/activate
          pip install -r starters/rag-bot-llamaindex/requirements.txt
      - name: LlamaIndex RAG starter - smoke
        run: |
          source .venv/bin/activate
          python - << 'PY'
          import sys
          sys.path.append('starters/rag-bot-llamaindex')
          import app
          print('llamaindex ok')
          PY
      - name: Temporal starter - install
        run: |
          source .venv/bin/activate
          pip install -r starters/temporal-workflows/requirements.txt || true
      - name: Temporal starter - smoke
        run: |
          source .venv/bin/activate
          python - << 'PY'
          import sys
          sys.path.append('starters/temporal-workflows')
          import workflows
          print('temporal ok')
          PY

  prompt-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run prompt evaluations (conditional)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            npx --yes promptfoo@latest eval -c evals/promptfoo.yaml
          else
            echo "Skipping prompt evaluations; OPENAI_API_KEY not set."
          fi
