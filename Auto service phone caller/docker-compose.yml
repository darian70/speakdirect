services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  api:
    build:
      context: ./apps/api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app

  rqworker:
    build:
      context: ./apps/api
    env_file: .env
    command: ["rq", "worker", "-u", "${REDIS_URL}", "${RQ_QUEUE}"]
    depends_on:
      - redis
    volumes:
      - ./apps/api:/app

  rqdash:
    image: eoranged/rq-dashboard:latest
    environment:
      RQ_DASHBOARD_REDIS_URL: ${REDIS_URL}
    ports:
      - "9181:9181"
    depends_on:
      - redis

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
    volumes:
      - ./infra/n8n:/home/node/.n8n

  web:
    build:
      context: ./apps/web
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
      - API_INTERNAL_URL=http://api:8000
    ports:
      - "3001:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules

  voice-bridge:
    build:
      context: ./apps/voice-bridge
    env_file: .env
    environment:
      - PORT=8080
    ports:
      - "8081:8080"
    volumes:
      - ./apps/voice-bridge:/app
      - /app/node_modules

  scheduler:
    build:
      context: ./apps/api
    env_file: .env
    command: ["python", "-m", "app.events.scheduler"]
    depends_on:
      redis:
        condition: service_started
      api:
        condition: service_started

volumes:
  pgdata:
  redisdata:
