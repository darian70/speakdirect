providers:
  - id: openai:gpt-4o-mini
    config:
      apiKeyEnvar: OPENAI_API_KEY

prompts:
  - id: agent.answer
    prompt: |
      You are an enterprise agent. Answer the user's question concisely with sources if available.
      Question: {{question}}

tests:
  - vars:
      question: What is your uptime target?
    assert:
      - type: similar
        value: "99.9%"
        threshold: 0.4
